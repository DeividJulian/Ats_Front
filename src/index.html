<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Portal ATS · Selección de personal para pymes</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Publica vacantes y encuentra al candidato ideal en minutos con un ranking explicable por inteligencia artificial.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <script>
    // Applies the saved theme before Angular starts, so the page does not flash white
    try {
      var t = localStorage.getItem('ats.theme');
      if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('is-dark');
    } catch (e) {}
  </script>
  <app-root></app-root>
</body>
</html>
